name: build

# 矩阵构建：操作系统 × CPU 架构 × 推理后端
#
#   linux  x64    cpu / cuda / rocm
#   linux  arm64  cpu / cuda
#   windows x64   cpu / cuda / directml (AMD/Intel 走 DirectML)
#   windows arm64 cpu
#   macos  arm64  cpu / coreml
#   macos  x64    cpu           (onnxruntime 1.32 无 x64 macOS 轮子，锁定 1.23.2)
#
# 默认行为（不填 targets）：构建全部目标，并全部上传到 Release。
# Release 版本号：默认取最新的正式版本 vX.Y.Z 并把第三位 +1。
#
# 注意：CUDA / ROCm 运行时（数 GB）不随包分发，目标机需自备；
#       托管 runner 没有 GPU，GPU 版只验证「能装、能启动、模型能跑在 CPU》」。

on:
  workflow_dispatch:
    inputs:
      targets:
        description: '只构建指定 slug（逗号分隔，留空=全部）'
        required: false
        default: ''
      release_tag:
        description: '指定 Release tag（留空=自动把最新正式版第三位 +1）'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

jobs:
  # ---------------------------------------------------------------- 计算版本号
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          WANT: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "使用 tag 触发：$REF_NAME"
            exit 0
          fi
          if [ -n "${WANT:-}" ]; then
            echo "tag=$WANT" >> "$GITHUB_OUTPUT"
            echo "使用指定版本：$WANT"
            exit 0
          fi
          # 取最新正式版本（非预发布、形如 vX.Y.Z），第三位 +1
          LATEST=$(gh release list --limit 100 --json tagName,isPrerelease \
            --jq '[.[] | select(.isPrerelease == false) | .tagName
                   | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))] | first // ""')
          if [ -z "$LATEST" ]; then
            NEXT="v1.0.0"
          else
            MAJ=$(echo "$LATEST" | cut -d. -f1 | tr -d 'v')
            MIN=$(echo "$LATEST" | cut -d. -f2)
            PAT=$(echo "$LATEST" | cut -d. -f3)
            NEXT="v${MAJ}.${MIN}.$((PAT + 1))"
          fi
          echo "tag=$NEXT" >> "$GITHUB_OUTPUT"
          echo "最新正式版：${LATEST:-（无）} → 本次发布：$NEXT"

  # ---------------------------------------------------------------- 冒烟测试
  smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    name: smoke / ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install --timeout 60 --retries 3 -r requirements.txt

      - name: 获取模型
        run: python tools/fetch_models.py

      - name: 冒烟测试
        run: |
          python -c "import onnxruntime as o;print('onnxruntime',o.__version__,'|',o.get_available_providers())"
          python tools/smoke_test.py

  # ---------------------------------------------------------------- 便携包矩阵
  portable:
    needs: [prepare, smoke]
    if: ${{ always() && needs.smoke.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Linux x86_64 ----
          - { slug: linux-x64-cpu,      os: ubuntu-latest,     arch: x64,   backend: cpu,      ort: onnxruntime,           ext: tar.gz, preview: false }
          - { slug: linux-x64-cuda,     os: ubuntu-latest,     arch: x64,   backend: cuda,     ort: onnxruntime-gpu,       ext: tar.gz, preview: false }
          - { slug: linux-x64-rocm,     os: ubuntu-latest,     arch: x64,   backend: rocm,     ort: onnxruntime-rocm,      ext: tar.gz, preview: false }
          # ---- Linux arm64 ----
          - { slug: linux-arm64-cpu,    os: ubuntu-24.04-arm,  arch: arm64, backend: cpu,      ort: onnxruntime,           ext: tar.gz, preview: true  }
          - { slug: linux-arm64-cuda,   os: ubuntu-24.04-arm,  arch: arm64, backend: cuda,     ort: onnxruntime-gpu,       ext: tar.gz, preview: true  }
          # ---- Windows x64 ----
          - { slug: win-x64-cpu,        os: windows-latest,    arch: amd64, backend: cpu,      ort: onnxruntime,           ext: zip,    preview: false }
          - { slug: win-x64-cuda,       os: windows-latest,    arch: amd64, backend: cuda,     ort: onnxruntime-gpu,       ext: zip,    preview: false }
          - { slug: win-x64-directml,   os: windows-latest,    arch: amd64, backend: directml, ort: onnxruntime-directml,  ext: zip,    preview: false }
          # ---- Windows arm64 ----
          - { slug: win-arm64-cpu,      os: windows-11-arm,    arch: arm64, backend: cpu,      ort: onnxruntime,           ext: zip,    preview: true  }
          # ---- macOS arm64 ----
          - { slug: mac-arm64-cpu,      os: macos-latest,      arch: arm64, backend: cpu,      ort: onnxruntime,           ext: tar.gz, preview: false }
          - { slug: mac-arm64-coreml,   os: macos-latest,      arch: arm64, backend: coreml,   ort: onnxruntime,           ext: tar.gz, preview: false }
          # ---- macOS Intel（macos-13 已退役，用 macos-15-intel）----
          - { slug: mac-x64-cpu,        os: macos-15-intel,    arch: x64,   backend: cpu,      ort: "onnxruntime==1.23.2", ext: tar.gz, preview: false }
    runs-on: ${{ matrix.os }}
    continue-on-error: false
    name: portable / ${{ matrix.slug }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: 判断是否构建
        id: gate
        shell: bash
        env:
          TARGETS: ${{ github.event.inputs.targets }}
          SLUG: ${{ matrix.slug }}
        run: |
          T="${TARGETS:-}"
          if [ -z "$T" ] || echo ",$T," | grep -q ",$SLUG,"; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "跳过 $SLUG（不在 targets 里）"
          fi

      - uses: actions/setup-python@v7
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: '3.11'

      - name: 构建便携包（Windows）
        if: steps.gate.outputs.go == 'true' && startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          ./tools/make_portable.ps1 `
            -Arch ${{ matrix.arch }} `
            -OrtPackage "${{ matrix.ort }}" `
            -OutFile "dist/pcb-webapp-portable-${{ matrix.slug }}.${{ matrix.ext }}"

      - name: 构建便携包（Linux / macOS）
        if: steps.gate.outputs.go == 'true' && !startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          bash tools/make_portable.sh \
            --ort "${{ matrix.ort }}" \
            --out "dist/pcb-webapp-portable-${{ matrix.slug }}.${{ matrix.ext }}"

      - name: 上传 artifact
        if: steps.gate.outputs.go == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: portable-${{ matrix.slug }}
          path: dist/pcb-webapp-portable-${{ matrix.slug }}.*
          retention-days: 3
          if-no-files-found: error

      - name: 发布到 Release
        if: steps.gate.outputs.go == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SLUG: ${{ matrix.slug }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          echo "发布到 $TAG"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            cat > release-notes.md <<'NOTES'
          由 Actions run #__RUN__ 构建（commit __SHA__）。

          资产命名：pcb-webapp-portable-<系统>-<架构>-<后端>.zip|tar.gz

          | 系统 | 架构 | 后端 |
          | --- | --- | --- |
          | linux | x64 | cpu / cuda / rocm |
          | linux | arm64 | cpu / cuda |
          | windows | x64 | cpu / cuda / directml |
          | windows | arm64 | cpu |
          | macos | arm64 | cpu / coreml |
          | macos | x64 | cpu（onnxruntime 1.23.2） |

          解压后：Windows 双击 start.bat，Linux/macOS 执行 ./start.sh。
          CUDA / ROCm 运行时需目标机自备。
          NOTES
            sed -i.bak "s/__RUN__/$RUN_NUMBER/;s/__SHA__/${GITHUB_SHA:0:7}/" release-notes.md
            gh release create "$TAG" --title "$TAG 便携版（全平台）" --notes-file release-notes.md --latest
          else
            echo "Release $TAG 已存在，追加/覆盖资产"
          fi
          ls -lh dist/
          gh release upload "$TAG" dist/pcb-webapp-portable-${SLUG}.* --clobber
