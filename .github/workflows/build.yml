name: build

# 矩阵构建：操作系统 × CPU 架构 × 推理后端
#
#   linux  x64    cpu / cuda / rocm
#   linux  arm64  cpu / cuda            (预编译轮子存在；runner 为 public preview)
#   win    x64    cpu / cuda / directml (AMD/Intel 走 DirectML)
#   win    arm64  cpu                   (runner 为 public preview)
#   mac    arm64  cpu / coreml
#   mac    x64    cpu                   (onnxruntime 1.32 无 x64 macOS 轮子，锁定 1.23.2)
#
# 说明：CUDA / ROCm 运行时（数 GB）不随包分发，目标机需自备；
#       CI runner 没有 GPU，因此 GPU 版只验证「能装包、能启动、模型能跑在 CPU 上」。

on:
  workflow_dispatch:
    inputs:
      targets:
        description: '要构建的目标 slug，逗号分隔（留空=全部）。例：linux-x64-cpu,win-x64-cuda'
        required: false
        default: ''
      release_tag:
        description: '发布到的 Release tag（留空 = latest-build 滚动包）'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'

jobs:
  # ---------------------------------------------------------------- 冒烟测试
  smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    name: smoke / ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install --timeout 60 --retries 3 -r requirements.txt

      - name: 获取模型
        run: python tools/fetch_models.py

      - name: 冒烟测试
        run: |
          python -c "import onnxruntime as o;print('onnxruntime',o.__version__,'|',o.get_available_providers())"
          python tools/smoke_test.py

  # ---------------------------------------------------------------- 便携包矩阵
  portable:
    needs: smoke
    if: ${{ always() && needs.smoke.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Linux x86_64 ----
          - { slug: linux-x64-cpu,      os: ubuntu-latest,  arch: x64,   backend: cpu,      ort: onnxruntime,          ext: tar.gz, preview: false }
          - { slug: linux-x64-cuda,     os: ubuntu-latest,  arch: x64,   backend: cuda,     ort: onnxruntime-gpu,      ext: tar.gz, preview: false }
          - { slug: linux-x64-rocm,     os: ubuntu-latest,  arch: x64,   backend: rocm,     ort: onnxruntime-rocm,     ext: tar.gz, preview: false }
          # ---- Linux arm64（runner 为 public preview）----
          - { slug: linux-arm64-cpu,    os: ubuntu-24.04-arm, arch: arm64, backend: cpu,    ort: onnxruntime,          ext: tar.gz, preview: true }
          - { slug: linux-arm64-cuda,   os: ubuntu-24.04-arm, arch: arm64, backend: cuda,   ort: onnxruntime-gpu,      ext: tar.gz, preview: true }
          # ---- Windows x64 ----
          - { slug: win-x64-cpu,        os: windows-latest, arch: amd64, backend: cpu,      ort: onnxruntime,          ext: zip,    preview: false }
          - { slug: win-x64-cuda,       os: windows-latest, arch: amd64, backend: cuda,     ort: onnxruntime-gpu,      ext: zip,    preview: false }
          - { slug: win-x64-directml,   os: windows-latest, arch: amd64, backend: directml, ort: onnxruntime-directml, ext: zip,    preview: false }
          # ---- Windows arm64（preview）----
          - { slug: win-arm64-cpu,      os: windows-11-arm, arch: arm64, backend: cpu,      ort: onnxruntime,          ext: zip,    preview: true }
          # ---- macOS ----
          - { slug: mac-arm64-cpu,      os: macos-latest,   arch: arm64, backend: cpu,      ort: onnxruntime,          ext: tar.gz, preview: false }
          - { slug: mac-arm64-coreml,   os: macos-latest,   arch: arm64, backend: coreml,   ort: onnxruntime,          ext: tar.gz, preview: false }
          - { slug: mac-x64-cpu,        os: macos-13,       arch: x64,   backend: cpu,      ort: "onnxruntime==1.23.2", ext: tar.gz, preview: true }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.preview }}
    name: portable / ${{ matrix.slug }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: 判断是否构建
        id: gate
        shell: bash
        env:
          TARGETS: ${{ github.event.inputs.targets }}
          SLUG: ${{ matrix.slug }}
        run: |
          T="${TARGETS:-}"
          if [ -z "$T" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif echo ",$T," | grep -q ",$SLUG,"; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "跳过 $SLUG（不在 targets 里）"
          fi

      - uses: actions/setup-python@v7
        if: steps.gate.outputs.go == 'true'
        with:
          python-version: '3.11'

      - name: 构建便携包（Windows）
        if: steps.gate.outputs.go == 'true' && startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          ./tools/make_portable.ps1 `
            -Arch ${{ matrix.arch }} `
            -OrtPackage "${{ matrix.ort }}" `
            -OutFile "dist/pcb-webapp-portable-${{ matrix.slug }}.${{ matrix.ext }}"

      - name: 构建便携包（Linux / macOS）
        if: steps.gate.outputs.go == 'true' && !startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          bash tools/make_portable.sh \
            --ort "${{ matrix.ort }}" \
            --out "dist/pcb-webapp-portable-${{ matrix.slug }}.${{ matrix.ext }}"

      - name: 上传 artifact
        if: steps.gate.outputs.go == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: portable-${{ matrix.slug }}
          path: dist/pcb-webapp-portable-${{ matrix.slug }}.*
          retention-days: 3
          if-no-files-found: error

      - name: 发布到 Release
        if: steps.gate.outputs.go == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
          WANT_TAG: ${{ github.event.inputs.release_tag }}
          SLUG: ${{ matrix.slug }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            TAG="$REF_NAME"; PRE=""; TITLE="$REF_NAME 便携版"
          elif [ -n "${WANT_TAG:-}" ]; then
            TAG="$WANT_TAG"; PRE=""; TITLE="$WANT_TAG 便携版"
          else
            TAG="latest-build"; PRE="--prerelease"; TITLE="latest-build · 滚动构建"
          fi
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TITLE" --notes "由 Actions run #$RUN_NUMBER 构建（commit ${GITHUB_SHA:0:7}）。" $PRE
          ls -lh dist/
          gh release upload "$TAG" dist/pcb-webapp-portable-${SLUG}.* --clobber