<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCB 缺陷检测</title>
<style>
  :root { --bg:#0f1216; --card:#171c22; --line:#26303a; --fg:#e6edf3; --muted:#8b98a5; --accent:#3aa76d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  header { padding:14px 24px; border-bottom:1px solid var(--line); display:flex;
           align-items:center; gap:14px; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0; font-weight:600; }
  select { background:#0f1519; color:var(--fg); border:1px solid var(--line);
           border-radius:8px; padding:6px 10px; font-size:13px; }
  .tabs { display:flex; gap:6px; margin-left:auto; }
  .tab { background:transparent; border:1px solid var(--line); color:var(--muted);
         border-radius:8px; padding:6px 14px; font-size:13px; cursor:pointer; }
  .tab.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  main { padding:18px 24px 40px; }
  .panel { display:none; }
  .panel.on { display:block; }
  .grid2 { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:20px; }
  @media (max-width:900px){ .grid2 { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  .drop { border:2px dashed var(--line); border-radius:10px; min-height:300px; display:flex;
          align-items:center; justify-content:center; text-align:center; cursor:pointer;
          color:var(--muted); overflow:hidden; transition:.15s; }
  .drop:hover, .drop.over { border-color:var(--accent); color:var(--fg); }
  .drop img { max-width:100%; max-height:520px; display:block; margin:0 auto; border-radius:6px; }
  .out { min-height:300px; display:flex; align-items:center; justify-content:center; color:var(--muted); }
  .out img { max-width:100%; max-height:520px; display:block; border-radius:6px; }
  .row { display:flex; gap:12px; align-items:center; margin-top:12px; flex-wrap:wrap; }
  label.p { display:flex; align-items:center; gap:7px; font-size:13px; color:var(--muted); }
  input[type=range]{ width:120px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:8px 16px;
           font-size:13px; cursor:pointer; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--fg); }
  button.stop { background:#c0392b; }
  .summary { margin-top:12px; font-size:14px; line-height:1.7; white-space:pre-wrap; }
  table { width:100%; border-collapse:collapse; font-size:13px; margin-top:12px; }
  th,td { padding:6px 8px; border-bottom:1px solid var(--line); text-align:left; }
  th { color:var(--muted); font-weight:500; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .tag { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px;
         background:#1f2b36; border:1px solid var(--line); }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { font-size:12px; color:var(--muted); border:1px solid var(--line); border-radius:999px;
          padding:2px 9px; }
  .chip b { color:var(--fg); font-weight:500; }
  .err { color:#ff7b72; }
  .hint { color:var(--muted); font-size:12px; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px;
         vertical-align:middle; }
  /* 实时区 */
  .stage { position:relative; background:#000; border-radius:10px; overflow:hidden;
           min-height:320px; display:flex; align-items:center; justify-content:center; }
  #video { max-width:100%; max-height:62vh; display:block; }
  #overlay { position:absolute; left:0; top:0; pointer-events:none; }
  #hud { position:absolute; left:10px; top:10px; background:rgba(0,0,0,.6);
         color:#b7f7c8; font-size:12px; padding:7px 9px; border-radius:8px;
         line-height:1.6; white-space:pre; }
  #hud:empty { display:none; }
  .stage .placeholder { color:var(--muted); font-size:13px; text-align:center; padding:40px; }
</style>
</head>
<body>
<header>
  <h1>PCB 缺陷检测</h1>
  <label class="p">模型 <select id="modelSel"><option>加载中…</option></select></label>
  <span class="hint" id="modelSub"></span>
  <div class="tabs">
    <button class="tab on" id="tabSingle">单张检测</button>
    <button class="tab" id="tabLive">实时检测</button>
  </div>
</header>

<main>
  <!-- ============ 单张 ============ -->
  <section class="panel on" id="panelSingle">
    <div class="grid2">
      <div class="card">
        <div id="drop" class="drop">点击选择图片，或把图片拖到这里<br><span style="font-size:12px">jpg / png / bmp</span></div>
        <input id="file" type="file" accept="image/*" hidden>
        <div class="chips" id="chips"></div>
        <div class="row">
          <label class="p"><input id="usePerClass" type="checkbox" checked> 按类别推荐阈值</label>
          <label class="p">置信度 <input id="conf" type="range" min="0.05" max="0.95" step="0.05" value="0.25" disabled><b id="confV">0.25</b></label>
          <label class="p">IoU <input id="iou" type="range" min="0.1" max="0.9" step="0.05" value="0.45"><b id="iouV">0.45</b></label>
        </div>
        <div class="row">
          <button id="run" disabled>开始检测</button>
          <button id="csv" class="ghost" disabled>导出 CSV</button>
          <span id="meta" class="hint"></span>
        </div>
      </div>
      <div class="card">
        <div id="out" class="out">检测结果会显示在这里</div>
        <div id="summary" class="summary"></div>
        <table id="table" hidden>
          <thead><tr><th>#</th><th>类别</th><th>置信度</th><th class="num">x1</th><th class="num">y1</th>
          <th class="num">x2</th><th class="num">y2</th><th class="num">宽×高</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- ============ 实时 ============ -->
  <section class="panel" id="panelLive">
    <div class="grid2">
      <div class="card">
        <div class="stage" id="stage">
          <video id="video" playsinline muted autoplay style="display:none"></video>
          <canvas id="overlay"></canvas>
          <div id="hud"></div>
          <div class="placeholder" id="ph">点下面的按钮开始<br>摄像头 / 抓取窗口或屏幕</div>
        </div>
        <div class="row">
          <button id="btnCam">📷 摄像头</button>
          <button id="btnScreen" class="ghost">🪟 抓取窗口 / 屏幕</button>
          <button id="btnTest" class="ghost" title="用合成画面验证链路，不需要摄像头">🧪 自测</button>`n          <button id="btnStop" class="stop" disabled>停止</button>
          <span class="hint" id="liveHint"></span>
        </div>
        <div class="row">
          <label class="p">IoU <input id="iouLive" type="range" min="0.1" max="0.9" step="0.05" value="0.45"><b id="iouLiveV">0.45</b></label>
          <label class="p"><input id="usePerClassLive" type="checkbox" checked> 按类别推荐阈值</label>
          <label class="p"><input id="liveHiRes" type="checkbox"> <span title="不降采样、不加重压缩、阈值按模型原值，输入条件与单张检测一致">高精度（等同单张）</span></label>
          <button id="btnRoi" class="ghost" title="在画面上拖出一个矩形，只检测这块区域（放大局部 = 单张精度）">🔍 框选区域</button>
          <button id="btnRoiClear" class="ghost" hidden>✕ 清除区域</button>
          <label class="p">置信度 <input id="confLive" type="range" min="0.05" max="0.95" step="0.05" value="0.25" disabled><b id="confLiveV">0.25</b></label>
        </div>
        <div class="hint" id="liveNote"></div>
      </div>
      <div class="card">
        <div class="chips" id="chipsLive"></div>
        <div id="liveSummary" class="summary">未开始</div>
        <table id="liveTable" hidden>
          <thead><tr><th>#</th><th>类别</th><th>置信度</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<script>
// 统一处理接口返回：非 JSON（例如 404 的 HTML 页面）时给出可读的报错
async function fetchJSON(url, opts) {
  const r = await fetch(url, opts);
  const ct = (r.headers.get('content-type') || '').toLowerCase();
  if (!ct.includes('application/json')) {
    const body = (await r.text()).slice(0, 200).replace(/\s+/g, ' ');
    throw new Error(`接口 ${url} 返回了非 JSON（HTTP ${r.status}）: ${body}`);
  }
  const j = await r.json();
  if (j && j.ok === false && j.error) {
    const more = j.detail ? ` — ${j.detail}` : (j.hint ? ` — ${j.hint}` : '');
    if (j.traceback) console.error(j.traceback);
    throw new Error(`接口 ${url} 出错: ${j.error}${more}`);
  }
  return j;
}

const $ = id => document.getElementById(id);
const COLORS = ['#FF5252','#FFB300','#40C4FF','#FF4081','#7C4DFF','#00E676','#FF6E40','#E040FB','#18FFFF'];
let currentFile = null, lastDetections = [], MODELS = [], CURRENT = null;

/* ---------------- 模型 ---------------- */
function renderChips(m, elId) {
  const el = $(elId);
  el.innerHTML = '';
  m.classes.forEach(c => {
    const d = document.createElement('span');
    d.className = 'chip';
    d.innerHTML = `<span class="dot" style="background:${COLORS[c.index % COLORS.length]}"></span>` +
                  `<b>${c.cn || c.name}</b> · ${c.conf.toFixed(3)}`;
    el.appendChild(d);
  });
}

async function loadModels() {
  try {
    const j = await fetchJSON('/api/models');
    MODELS = j.models || [];
    const sel = $('modelSel');
    sel.innerHTML = '';
    if (!MODELS.length) { sel.innerHTML = '<option>models/ 里没找到模型</option>'; return; }
    MODELS.forEach(m => {
      const o = document.createElement('option');
      o.value = m.key; o.textContent = m.label;
      sel.appendChild(o);
    });
    const saved = localStorage.getItem('pcb_model');
    if (saved && MODELS.some(m => m.key === saved)) sel.value = saved;
    else if (MODELS.some(m => m.key === 'solder')) sel.value = 'solder';
    selectModel(sel.value);
  } catch (e) {
    $('modelSub').textContent = '模型列表加载失败：' + e.message;
  }
}

function selectModel(key) {
  CURRENT = MODELS.find(m => m.key === key) || MODELS[0];
  if (!CURRENT) return;
  localStorage.setItem('pcb_model', CURRENT.key);
  renderChips(CURRENT, 'chips');
  renderChips(CURRENT, 'chipsLive');
  $('modelSub').textContent = `${CURRENT.file} · imgsz ${CURRENT.imgsz} · ${CURRENT.classes.length} 类`;
  ['', 'Live'].forEach(sfx => {
    $('conf' + sfx).value = CURRENT.global_conf.toFixed(2);
    $('conf' + sfx + 'V').textContent = (+$('conf' + sfx).value).toFixed(2);
  });
  updateConfState();
}

function updateConfState() {
  const per = CURRENT && CURRENT.has_per_class_conf && $('usePerClass').checked;
  $('conf').disabled = !!per; $('confV').style.opacity = per ? .4 : 1;
  const perL = CURRENT && CURRENT.has_per_class_conf && $('usePerClassLive').checked;
  $('confLive').disabled = !!perL; $('confLiveV').style.opacity = perL ? .4 : 1;
}

$('modelSel').onchange = e => selectModel(e.target.value);
$('usePerClass').onchange = updateConfState;
$('usePerClassLive').onchange = updateConfState;
$('conf').oninput = e => $('confV').textContent = (+e.target.value).toFixed(2);
$('confLive').oninput = e => $('confLiveV').textContent = (+e.target.value).toFixed(2);
$('iou').oninput = e => $('iouV').textContent = (+e.target.value).toFixed(2);
$('iouLive').oninput = e => $('iouLiveV').textContent = (+e.target.value).toFixed(2);

/* ---------------- 标签页 ---------------- */
function showTab(which) {
  const live = which === 'live';
  $('panelSingle').classList.toggle('on', !live);
  $('panelLive').classList.toggle('on', live);
  $('tabSingle').classList.toggle('on', !live);
  $('tabLive').classList.toggle('on', live);
  if (!live) stopLive();
  else requestAnimationFrame(renderOverlay);
}
$('tabSingle').onclick = () => showTab('single');
$('tabLive').onclick = () => showTab('live');

/* ---------------- 单张 ---------------- */
function preview(file) {
  if (!file) return;
  currentFile = file;
  $('drop').innerHTML = `<img src="${URL.createObjectURL(file)}" alt="preview">`;
  $('run').disabled = false;
  $('out').innerHTML = '点击「开始检测」';
  $('summary').textContent = ''; $('table').hidden = true;
  $('meta').textContent = `${file.name} · ${(file.size/1024).toFixed(0)} KB`;
}
$('drop').onclick = () => $('file').click();
$('file').onchange = e => preview(e.target.files[0]);
['dragenter','dragover'].forEach(ev => $('drop').addEventListener(ev, e => {
  e.preventDefault(); $('drop').classList.add('over'); }));
['dragleave','drop'].forEach(ev => $('drop').addEventListener(ev, e => {
  e.preventDefault(); $('drop').classList.remove('over'); }));
$('drop').addEventListener('drop', e => { if (e.dataTransfer.files[0]) preview(e.dataTransfer.files[0]); });

$('run').onclick = async () => {
  if (!currentFile || !CURRENT) return;
  const t0 = performance.now();
  $('run').disabled = true; $('run').textContent = '检测中…';
  const fd = new FormData();
  fd.append('file', currentFile); fd.append('model', CURRENT.key);
  fd.append('iou', $('iou').value);
  if (!(CURRENT.has_per_class_conf && $('usePerClass').checked)) fd.append('conf', $('conf').value);
  try {
    const j = await fetchJSON('/api/predict', { method:'POST', body:fd });
    if (!j.ok) throw new Error(j.error || '服务返回错误');
    lastDetections = j.detections;
    $('out').innerHTML = `<img src="${j.image}" alt="result">`;
    $('summary').innerHTML = `<b>${j.summary}</b><span class="hint"> · ${j.model_label}` +
      ` · 原图 ${j.size.w}×${j.size.h} · 推理 ${j.ms} ms · 往返 ${Math.round(performance.now()-t0)} ms</span>`;
    const tb = $('table').querySelector('tbody');
    tb.innerHTML = j.detections.map((d,i) => `<tr>
      <td>${i+1}</td>
      <td><span class="dot" style="background:${COLORS[d.cls % COLORS.length]}"></span><span class="tag">${d.name}</span> ${d.cn}</td>
      <td class="num">${d.conf.toFixed(3)}</td>
      <td class="num">${d.xyxy[0]}</td><td class="num">${d.xyxy[1]}</td>
      <td class="num">${d.xyxy[2]}</td><td class="num">${d.xyxy[3]}</td>
      <td class="num">${d.w}×${d.h}</td></tr>`).join('');
    $('table').hidden = !j.detections.length;
    $('csv').disabled = !j.detections.length;
  } catch (err) {
    $('out').innerHTML = `<span class="err">${err.message}</span>`;
  } finally {
    $('run').disabled = false; $('run').textContent = '开始检测';
  }
};

$('csv').onclick = () => {
  const head = ['model','cls','name','cn','conf','x1','y1','x2','y2','w','h'];
  const lines = [head.join(',')].concat(lastDetections.map(d =>
    [CURRENT.key, d.cls, d.name, d.cn, d.conf, ...d.xyxy, d.w, d.h].join(',')));
  const blob = new Blob(['\ufeff' + lines.join('\n')], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (currentFile?.name.replace(/\.[^.]+$/, '') || 'detection') + '_' + CURRENT.key + '.csv';
  a.click();
};

/* ---------------- 实时 ---------------- */
const live = { stream:null, running:false, busy:false, timer:null,
               fps:0, lastTs:0, frames:0, ms:0,
               boxes:[], sentW:0, sentH:0, maxDim:1600, grab:null,
  roi:null,            // {x,y,w,h} 源视频像素坐标
  sentOffset:{x:0,y:0}, sentRatio:1, srcW:0, srcH:0,
  roiMode:false, drag:null };

async function startLive(kind) {
  stopLive();
  try {
    // 自测模式：用合成画面当"视频源"，不需要摄像头（验证整条链路用）
    if (kind === 'test') {
      const cv = document.createElement('canvas');
      cv.width = 1280; cv.height = 960;
      const g = cv.getContext('2d');
      let t = 0;
      const timer = setInterval(() => {
        g.fillStyle = '#0b3d1f'; g.fillRect(0, 0, 1280, 960);
        for (let i = 0; i < 60; i++) {
          g.fillStyle = '#cfdcd0';
          g.beginPath();
          g.arc(90 + (i % 10) * 118, 130 + Math.floor(i / 10) * 120, 9, 0, 6.3);
          g.fill();
        }
        g.fillStyle = '#ff5252';
        g.fillRect(120 + (t++ * 20) % 900, 700, 70, 70);
      }, 100);
      live.testTimer = timer;
      live.source = cv;
      cv.style.maxWidth = '100%'; cv.style.maxHeight = '62vh'; cv.style.display = 'block';
      $('stage').insertBefore(cv, $('overlay'));
      live.sourceEl = cv;
      live.grab = 'test';
      $('ph').style.display = 'none';
      live.running = true; live.frames = 0; live.fps = 0; live.lastTs = 0;
      $('btnStop').disabled = false;
      $('btnCam').disabled = true; $('btnScreen').disabled = true; $('btnTest').disabled = true;
      $('liveHint').textContent = '自测模式（合成画面，无摄像头）';
      liveLoop();
      return;
    }
    let stream;
    if (kind === 'screen') {
      stream = await navigator.mediaDevices.getDisplayMedia({
        video: { frameRate: { ideal: 15 } }, audio: false });
      live.grab = 'screen';
    } else {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 } },
        audio: false });
      live.grab = 'camera';
    }
    live.stream = stream;
    const v = $('video');
    v.srcObject = stream;
    v.style.display = 'block';
    $('ph').style.display = 'none';
    await v.play();

    // 用户点浏览器原生的“停止共享”时同步状态
    stream.getVideoTracks()[0].addEventListener('ended', () => stopLive());

    live.running = true; live.frames = 0; live.fps = 0; live.lastTs = 0;
    $('btnStop').disabled = false;
    $('btnCam').disabled = true; $('btnScreen').disabled = true;
    $('liveHint').textContent = kind === 'screen'
      ? '正在抓取窗口/屏幕（在共享提示条上可随时停止）'
      : '摄像头已开启';
    liveLoop();
  } catch (e) {
    $('liveHint').innerHTML = `<span class="err">打开失败：${e.message}</span>`;
    $('liveNote').textContent = '提示：摄像头/抓取窗口要求安全上下文（http://127.0.0.1 或 https）。'
      + '如果通过局域网 IP 用 http 访问，浏览器会拒绝授权。';
  }
}

function stopLive() {
  live.running = false;
  if (live.timer) { clearTimeout(live.timer); live.timer = null; }
  if (live.stream) { live.stream.getTracks().forEach(t => t.stop()); live.stream = null; }
  if (live.testTimer) { clearInterval(live.testTimer); live.testTimer = null; }
  if (live.sourceEl && live.sourceEl.parentNode) live.sourceEl.parentNode.removeChild(live.sourceEl);
  live.sourceEl = null;
  live.drag = null; live.dragStart = null; live.roiMode = false;
  live.source = null;
  $('video').style.display = 'none';
  $('video').srcObject = null;
  $('ph').style.display = '';
  $('btnStop').disabled = true;
  $('btnCam').disabled = false; $('btnScreen').disabled = false;
  if ($('btnTest')) $('btnTest').disabled = false;
  $('hud').textContent = '';
  $('liveHint').textContent = '';
  const c = $('overlay'); c.getContext('2d')?.clearRect(0, 0, c.width, c.height);
  $('liveSummary').textContent = '未开始';
  $('liveTable').hidden = true;
}

$('btnCam').onclick = () => startLive('camera');
$('btnScreen').onclick = () => startLive('screen');
$('btnStop').onclick = stopLive;
$('btnTest').onclick = () => startLive('test');

/* ---- 框选区域（只检测选中部分 = 放大局部，达到单张检测的精度）---- */
function roiHint(msg) { const el = $('liveHint'); if (el) el.textContent = msg; }

$('btnRoi').onclick = () => {
  if (!live.running) { roiHint('先开启摄像头或抓取画面，再框选区域'); return; }
  live.roiMode = !live.roiMode;
  $('btnRoi').classList.toggle('on', live.roiMode);
  roiHint(live.roiMode ? '在画面上拖出一个矩形（Esc 取消）' : '');
};

$('btnRoiClear').onclick = () => {
  live.roi = null; live.roiMode = false;
  $('btnRoiClear').hidden = true;
  $('btnRoi').classList.remove('on');
  roiHint('已清除框选区，恢复整幅画面');
};

// 显示坐标 → 源视频坐标
function dispToVideo(ev) {
  const r = $('overlay').getBoundingClientRect();
  const sx = live.srcW / Math.max(1, r.width);
  const sy = live.srcH / Math.max(1, r.height);
  return { x: Math.max(0, Math.min(live.srcW, (ev.clientX - r.left) * sx)),
           y: Math.max(0, Math.min(live.srcH, (ev.clientY - r.top) * sy)) };
}

$('overlay').addEventListener('pointerdown', (ev) => {
  if (!live.roiMode || !live.running) return;
  ev.preventDefault();
  $('overlay').setPointerCapture(ev.pointerId);
  const p0 = dispToVideo(ev);
  live.dragStart = p0;
  live.drag = { x: p0.x, y: p0.y, w: 0, h: 0 };
});

$('overlay').addEventListener('pointermove', (ev) => {
  if (!live.roiMode || !live.dragStart) return;
  const p1 = dispToVideo(ev);
  const a = live.dragStart;
  live.drag = {
    x: Math.min(a.x, p1.x), y: Math.min(a.y, p1.y),
    w: Math.abs(p1.x - a.x), h: Math.abs(p1.y - a.y),
  };
});

$('overlay').addEventListener('pointerup', () => {
  if (!live.drag) return;
  const r = live.drag;
  live.drag = null; live.dragStart = null;
  if (r.w < 40 || r.h < 40) { roiHint('框太小，已忽略（至少 40×40 像素）'); return; }
  live.roi = { x: Math.round(r.x), y: Math.round(r.y), w: Math.round(r.w), h: Math.round(r.h) };
  live.roiMode = false;
  $('btnRoi').classList.remove('on');
  $('btnRoiClear').hidden = false;
  roiHint(`框选 ${live.roi.w}×${live.roi.h} —— 只检测该区域`);
});

document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' && live.roiMode) {
    live.roiMode = false; live.drag = null; live.dragStart = null;
    $('btnRoi').classList.remove('on');
    roiHint('已取消框选');
  }
});

function liveLoop() {
  if (!live.running) return;
  if (!live.busy) captureOnce();
  live.timer = setTimeout(liveLoop, 50);   // 采集节奏；真正的瓶颈是推理
}

async function captureOnce() {
  const v = live.source || $('video');
  const vw = v.videoWidth || v.width, vh = v.videoHeight || v.height;
  if (!vw) return;
  live.srcW = vw; live.srcH = vh;

  const hi = $('liveHiRes') && $('liveHiRes').checked;
  const roi = live.roi || { x: 0, y: 0, w: vw, h: vh };
  const limit = hi ? Infinity : live.maxDim;
  const scale = Math.min(1, limit / Math.max(roi.w, roi.h));
  const w = Math.max(1, Math.round(roi.w * scale)), h = Math.max(1, Math.round(roi.h * scale));

  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  cv.getContext('2d').drawImage(v, roi.x, roi.y, roi.w, roi.h, 0, 0, w, h);

  // 记住映射关系，供把检测框画回整幅画面
  live.sentOffset = { x: roi.x, y: roi.y };
  live.sentRatio = roi.w / w;

  const blob = await new Promise(res => cv.toBlob(res, 'image/jpeg', hi ? 0.95 : 0.85));
  if (!blob) return;

  live.busy = true;
  const fd = new FormData();
  fd.append('file', blob, 'frame.jpg');
  fd.append('model', CURRENT.key);
  fd.append('iou', $('iouLive').value);
  if (!(CURRENT.has_per_class_conf && $('usePerClassLive').checked)) {
    fd.append('conf', $('confLive').value);
  } else if (!($('liveHiRes') && $('liveHiRes').checked)) {
    // 普通模式：放宽到 0.6（画面里缺陷像素少、分数偏低）
    // 高精度模式不加宽，完全按模型阈值 —— 与单张检测一致
    fd.append('conf_scale', '0.6');
  }
  try {
    const j = await fetchJSON('/api/detect', { method:'POST', body:fd });
    if (j.ok) {
      live.boxes = j.detections; live.sentW = j.size.w; live.sentH = j.size.h;
      live.ms = j.ms;
      live.frames++;
      const now = performance.now();
      if (live.lastTs) {
        const inst = 1000 / Math.max(1, now - live.lastTs);
        live.fps = live.fps ? live.fps * 0.8 + inst * 0.2 : inst;
      }
      live.lastTs = now;
      updateLivePanel(j);
    }
  } catch (e) { /* 单帧失败不影响继续 */ }
  finally { live.busy = false; }
}

function updateLivePanel(j) {
  const counts = {};
  j.detections.forEach(d => { const k = d.cn || d.name; counts[k] = (counts[k] || 0) + 1; });
  const brief = Object.keys(counts).length
    ? Object.entries(counts).map(([k, v]) => `${k}×${v}`).join('  ')
    : '无缺陷';
  const ms = (j.max_score !== undefined && j.max_score !== null) ? j.max_score.toFixed(3) : '-';
  $('hud').textContent =
    `检测 ${live.fps.toFixed(1)} fps · 推理 ${j.ms} ms\n` +
    `帧 ${j.size.w}×${j.size.h} · 缺陷 ${j.detections.length} 个 · 最高分 ${ms}\n${brief}`;

  let tip = '';
  if (!j.detections.length && j.max_score >= 0.15) {
    tip = `<br><span class="hint">模型最高分 ${j.max_score.toFixed(3)}，低于该类别阈值；` +
          `可取消「按类别推荐阈值」或降低置信度后再看</span>`;
  }
  $('liveSummary').innerHTML = `<b>缺陷 ${j.detections.length} 个</b>` +
    `<span class="hint"> · ${CURRENT.label} · 单帧推理 ${j.ms} ms · ${live.fps.toFixed(1)} fps · 最高分 ${ms}</span>`
    + (j.detections.length ? '<br>' + brief : tip);
  const tb = $('liveTable').querySelector('tbody');
  tb.innerHTML = j.detections.map((d,i) => `<tr><td>${i+1}</td>
    <td><span class="dot" style="background:${COLORS[d.cls % COLORS.length]}"></span><span class="tag">${d.name}</span> ${d.cn}</td>
    <td class="num">${d.conf.toFixed(3)}</td></tr>`).join('');
  $('liveTable').hidden = !j.detections.length;
}

/* 叠加层：每个动画帧重画一次，框跟得上画面 */
function renderOverlay() {
  const v = live.source || $('video'), c = $('overlay');
  if ($('panelLive').classList.contains('on')) {
    const rect = v.getBoundingClientRect();
    const stage = $('stage').getBoundingClientRect();
    if (rect.width > 0) {
      const dpr = window.devicePixelRatio || 1;
      if (c.width !== Math.round(rect.width * dpr) || c.height !== Math.round(rect.height * dpr)) {
        c.width = Math.round(rect.width * dpr);
        c.height = Math.round(rect.height * dpr);
      }
      c.style.width = rect.width + 'px';
      c.style.height = rect.height + 'px';
      c.style.left = (rect.left - stage.left) + 'px';
      c.style.top = (rect.top - stage.top) + 'px';
      const ctx = c.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, rect.width, rect.height);

      // 检测结果是在「送检图」坐标里；先还原到源视频坐标，再映射到显示尺寸
      const dScaleX = rect.width / Math.max(1, live.srcW);
      const dScaleY = rect.height / Math.max(1, live.srcH);
      const toX = (x) => (live.sentOffset.x + x * live.sentRatio) * dScaleX;
      const toY = (y) => (live.sentOffset.y + y * live.sentRatio) * dScaleY;

      // 框选区（已确认的 ROI + 正在拖拽的框）
      const drawRoi = (r, dash) => {
        const rx = r.x * dScaleX, ry = r.y * dScaleY;
        const rw = r.w * dScaleX, rh = r.h * dScaleY;
        ctx.save();
        ctx.setLineDash(dash || []);
        ctx.strokeStyle = '#ffd166';
        ctx.lineWidth = 2;
        ctx.strokeRect(rx, ry, rw, rh);
        ctx.restore();
      };
      if (live.roi) drawRoi(live.roi, [8, 5]);
      if (live.drag) drawRoi(live.drag, [4, 4]);

      if (live.sentW && live.boxes.length) {
        const sx = 1, sy = 1;
        ctx.lineWidth = 2.5;
        ctx.font = '12px ui-monospace, monospace';
        ctx.textBaseline = 'bottom';
        live.boxes.forEach(d => {
          const col = COLORS[d.cls % COLORS.length];
          const x1 = toX(d.xyxy[0]), y1 = toY(d.xyxy[1]);
          const x2 = toX(d.xyxy[2]), y2 = toY(d.xyxy[3]);
          ctx.strokeStyle = col;
          ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
          const label = `${d.name} ${d.conf.toFixed(2)}`;
          const tw = ctx.measureText(label).width + 8;
          const ty = y1 - 2 < 14 ? y2 + 16 : y1 - 2;
          ctx.fillStyle = col;
          ctx.fillRect(x1, ty - 14, tw, 15);
          ctx.fillStyle = '#101418';
          ctx.fillText(label, x1 + 4, ty);
        });
      }
    }
  }
  requestAnimationFrame(renderOverlay);
}

$('liveNote').textContent = '说明：抓取的是当前窗口/屏幕画面，适合把显微镜、相机软件、产线画面的窗口直接丢进来检测。'
  + '推理在服务端 CPU 上跑，帧率受模型速度限制（solder@800 约 1–2 fps/核）。';

loadModels();
requestAnimationFrame(renderOverlay);

// 支持 ?tab=live 直接打开实时页；?autostart=camera|screen 自动启动（kiosk/自测用）
const qs = new URLSearchParams(location.search);
if (qs.get('tab') === 'live') showTab('live');
if (qs.get('autostart')) {
  showTab('live');
  setTimeout(() => startLive(qs.get('autostart')), 600);
}
</script>
